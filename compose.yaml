services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moa_local}
      POSTGRES_DB: moa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
